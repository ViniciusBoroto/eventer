<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Detalhes do Evento</title>

  <link rel="stylesheet" href="../css/details_event.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <header class="navbar">
    <div class="top-actions">
      <a class="back-button" href="index.html">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
      <a class="orders-link" href="orders.html">Ver pedidos</a>
    </div>
  </header>

  <main class="event-container">

  <div class="event-image">

    <img id="eventImage">

  </div>

  <div class="event-details">

    <h1 id="eventName"></h1>

    <p id="eventDate"></p>

    <p id="eventTime"></p>

    <p id="eventLocation"></p>

    <p id="eventDescription"></p>

    <p id="eventPrice"></p>

    <p id="eventTickets"></p>

    <p class="status-message" id="statusMessage"></p>

    <button class="buy-button" id="buyButton" type="button">
      Comprar Ingresso
    </button>

  </div>

</main>


</body>

<script src="../js/api.js"></script>
<script src="../js/details_event.js"></script>

</html>
